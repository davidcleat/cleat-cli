name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20.x", "22.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      # cleatapi is a git dependency and builds itself on install.
      - name: Install
        run: npm install
      - name: Test
        run: npm test
      - name: Smoke test the binary
        run: node ./bin/cleat.js --help
